[package]
name = "ntfs-desktop"
default-run = "ntfs-desktop"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
plist = "1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
lto = "thin"
[workspace]
members = ["src-tauri"]
resolver = "2"
