[package]
name = "macntfs-core"
default-run = "macntfs-core"
version = "0.3.18"
edition = "2024"
authors = ["Lucky <473276@qq.com>"]
license = "MIT"

[dependencies]
plist = "1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
[workspace]
members = ["src-tauri"]
resolver = "2"
