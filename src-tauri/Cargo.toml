[package]
name = "macntfs"
version = "0.3.6"
edition = "2024"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
macntfs-core = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2"
